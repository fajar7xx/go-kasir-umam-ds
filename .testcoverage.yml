# Coverage profile file
profile: cover.out

# (optional) "Set of rules for files"
rules:
  # All files should have at least 80% coverage
  - name: "Business logic must have high coverage"
    threshold: 80

# Thresholds
threshold:
  # Minimum coverage per file (80%)
  file: 80

  # Minimum coverage per package (80%)
  package: 80

  # Total coverage across measured packages (67% based on current state)
  # This includes handlers, services, repositories, and utils only
  # Excludes: main, config, database, mocks
  total: 67

# Exclude files/packages that don't need high coverage
exclude:
  paths:
    # Main entry point
    - ^main\.go$

    # Configuration and constants
    - ^config/

    # Database initialization
    - ^internal/database/

    # Test mocks
    - ^internal/mocks/

    # Data models (structs only)
    - ^models/
    - ^internal/models/

    # Generated code
    - \.pb\.go$
    - _gen\.go$

    # Migrations
    - ^migrations/

# (optional) Override for specific files
override:
  # If some files legitimately can't reach 80%
  - threshold: 60
    path: ^cmd/

# Badge configuration (optional, untuk README)
badge:
  # File name for coverage badge
  file-name: coverage.svg
